<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Twój Koszyk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2>Podsumowanie zamówienia</h2>
            </div>
            <div class="card-body">
                {% if zabiegi %}
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nazwa zabiegu</th>
                                <th>Cena</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for zabieg in zabiegi %}
                                <tr>
                                    <td>{{ zabieg.nazwa }}</td>
                                    <td>{{ zabieg.koszt }} zł</td>
                                </tr>
                            {% endfor %}
                            <tr class="table-active">
                                <td><strong>RAZEM DO ZAPŁATY:</strong></td>
                                <td><strong>{{ suma }} zł</strong></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="mt-4">
                        <button class="btn btn-success btn-lg">✅ Potwierdź i zapłać</button>
                        <a href="{% url 'zabieg-list' %}" class="btn btn-secondary btn-lg">Kontynuuj zakupy</a>
                    </div>
                {% else %}
                    <p>Twój koszyk jest pusty.</p>
                    <a href="{% url 'zabieg-list' %}" class="btn btn-primary">Wróć do listy zabiegów</a>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
