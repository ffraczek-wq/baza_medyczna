<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista Lekarzy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">👨‍⚕️ Nasi Lekarze</h2>
            </div>
            
            <div class="card-body">
                {% if lekarze %}
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Imię</th>
                                <th>Nazwisko</th>
                                <th>Specjalizacja</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for Lekarz in lekarze %}
                                <tr>
                                    <td>{{ Lekarz.Imie }}</td>
                                    <td><strong>{{ Lekarz.Nazwisko }}</strong></td>
                                    <td>
                                        <span class="badge bg-info text-dark">{{ Lekarz.Specjalizacja }}</span>
                                    </td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                {% else %}
                    <div class="alert alert-warning" role="alert">
                        Brak lekarzy w bazie.
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

</body>
</html>
