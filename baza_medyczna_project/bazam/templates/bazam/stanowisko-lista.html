<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista Stanowisk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="text-center mb-4">
                    <div class="display-4 text-primary mb-2">📋</div>
                    <h1 class="fw-bold text-dark">Dostępne Stanowiska</h1>
                    <p class="text-muted">Wybierz stanowisko, aby zobaczyć szczegóły.</p>
                </div>

                <div class="list-group shadow-sm">
                    {% for stanowisko in stanowiska %}
                        <a href="{% url 'stanowisko-detal' stanowisko.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
                            <span class="fw-bold text-primary">{{ stanowisko.nazwa }}</span>
                            <span class="badge bg-light text-dark rounded-pill">➝</span>
                        </a>
                    {% empty %}
                        <div class="alert alert-warning text-center" role="alert">
                            Brak stanowisk w bazie danych.
                        </div>
                    {% endfor %}
                </div>

                <div class="text-center mt-4">
                    <a href="{% url 'strona_glowna' %}" class="btn btn-outline-secondary">
                        ⬅ Wróć na stronę główną
                    </a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
